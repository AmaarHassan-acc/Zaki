<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zaki Invoice</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zaki Invoice">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Zaki Invoice">
  <meta name="theme-color" content="#7A1F2B">
  <style>
    :root {
      --primary: #7A1F2B;
      --primary-soft: rgba(122, 31, 43, 0.10);
      --primary-dark: #54131C;
      --accent: #A63A48;
      --text: #221C1D;
      --text-main: #4B4244;
      --muted: #8B8082;
      --bg: #F7F4F1;
      --card: #FFFFFF;
      --surface: #FFFFFF;
      --line: #E7DEDA;
      --success: #2E9D67;
      --warning: #C98416;
      --error: #C94A4A;
      --badge-gray: #EDE7E4;
      --card-dark: #54131C;
      --card-dark-2: #7A1F2B;
      --card-dark-3: #A63A48;
      --danger: #C94A4A;
      --ok: var(--success);
      --glass-border: rgba(231, 222, 218, 0.86);
      --shadow: 0 14px 34px rgba(34, 28, 29, 0.08);
      --shadow-soft: 0 8px 22px rgba(34, 28, 29, 0.06);
      --radius-card: 24px;
      --radius-inner: 18px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .app {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 18px 16px 118px;
      position: relative;
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 218px;
      background:
        radial-gradient(circle at 92% 18%, rgba(122, 31, 43, 0.12) 0 52px, transparent 53px),
        linear-gradient(180deg, #FFFFFF 0%, #F7F4F1 100%);
      box-shadow: 0 16px 32px rgba(34, 28, 29, 0.05);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      z-index: 0;
    }

    .app::after {
      content: "";
      position: absolute;
      top: -34px;
      right: -62px;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 23px, rgba(122, 31, 43, 0.11) 24px 25px);
      opacity: 0.70;
      pointer-events: none;
      z-index: 0;
    }

    .topbar,
    #app {
      position: relative;
      z-index: 1;
    }

    #app {
      margin-top: 78px;
    }

    #app > .grid > .section-head:first-child h2,
    #app > .grid > .section-head:first-child h3 {
      color: var(--text);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 56px;
      margin-bottom: 0;
    }

    .topbar h1 {
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--text);
    }

    .topbar-heading {
      min-width: 0;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-heading h1 {
      flex: 1 1 auto;
    }

    .brand-mark-shell {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      padding: 3px;
    }

    .brand-mark-shell.small {
      width: 34px;
      height: 34px;
      flex-basis: 34px;
      border-radius: 13px;
      padding: 2px;
    }

    .home-heading .brand-mark-shell {
      width: 56px;
      height: 56px;
      flex-basis: 56px;
      border-radius: 19px;
      padding: 2px;
    }

    .brand-logo-svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .brand-logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 2.2mm;
      color: #221C1D;
      font-weight: 800;
      letter-spacing: 0;
    }

    .topbar-actions {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
    }

    .support-button {
      width: 40px;
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border-radius: 14px;
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
    }

    .support-button svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .lang-toggle {
      min-width: 78px;
      white-space: nowrap;
      min-height: 40px;
      background: #fff;
      color: var(--primary);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--glass-border);
    }

    .title {
      margin: 0;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .screen-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      gap: 10px;
    }

    .menu-card,
    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
    }

    .menu-card {
      min-height: 92px;
      padding: 16px 18px;
      color: var(--text);
      text-align: left;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .menu-card:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: var(--shadow-soft);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .dashboard-card {
      min-width: 0;
      padding: 13px;
      border-radius: var(--radius-inner);
      background: var(--surface);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
    }

    .dashboard-card.wide {
      grid-column: 1 / -1;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, var(--card-dark), var(--card-dark-2) 55%, var(--card-dark-3));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 18px 38px rgba(32, 32, 32, 0.20);
    }

    .dashboard-card.wide::after {
      content: "";
      position: absolute;
      right: 16px;
      bottom: 14px;
      width: 74px;
      height: 40px;
      opacity: 0.82;
      background:
        linear-gradient(to top, rgba(255,255,255,0.72) 42%, transparent 42%) 0 100% / 9px 100% no-repeat,
        linear-gradient(to top, rgba(255,255,255,0.72) 58%, transparent 58%) 16px 100% / 9px 100% no-repeat,
        linear-gradient(to top, rgba(255,255,255,0.72) 72%, transparent 72%) 32px 100% / 9px 100% no-repeat,
        linear-gradient(to top, rgba(255,255,255,0.72) 88%, transparent 88%) 48px 100% / 9px 100% no-repeat,
        linear-gradient(to top, rgba(255,255,255,0.72) 64%, transparent 64%) 64px 100% / 9px 100% no-repeat;
      border-radius: 10px;
    }

    .dashboard-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
    }

    .dashboard-card.wide .dashboard-label {
      color: rgba(255, 255, 255, 0.72);
    }

    .dashboard-value {
      display: block;
      color: var(--text);
      font-size: 16px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .dashboard-card.wide .dashboard-value {
      color: #fff;
      font-size: 18px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .quick-actions-compact {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .quick-actions .menu-card {
      min-height: 48px;
      padding: 10px 8px;
      border-radius: 18px;
      font-size: 12px;
      text-align: center;
    }

    .quick-actions-compact .menu-card {
      min-height: 82px;
      padding: 13px 10px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      gap: 7px;
      font-size: 12px;
      text-align: center;
      line-height: 1.15;
    }

    .quick-action-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--primary);
    }

    .quick-action-icon svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .recent-invoices-table {
      width: 100%;
      min-width: 0;
      table-layout: fixed;
    }

    .recent-invoices-table th,
    .recent-invoices-table td {
      padding: 4px 2px;
      font-size: 9.5px;
      line-height: 1.15;
      vertical-align: middle;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .recent-invoices-table th:nth-child(1),
    .recent-invoices-table td:nth-child(1) {
      width: 18%;
    }

    .recent-invoices-table th:nth-child(2),
    .recent-invoices-table td:nth-child(2) {
      width: 20%;
    }

    .recent-invoices-table th:nth-child(3),
    .recent-invoices-table td:nth-child(3) {
      width: 25%;
    }

    .recent-invoices-table th:nth-child(4),
    .recent-invoices-table td:nth-child(4) {
      width: 18%;
    }

    .recent-invoices-table th:nth-child(5),
    .recent-invoices-table td:nth-child(5) {
      width: 19%;
    }

    .recent-invoices-table .customer-name-link {
      max-width: 100%;
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
    }

    .recent-invoices-table .pill {
      min-height: 20px;
      padding: 3px 5px;
      font-size: 8.5px;
      white-space: normal;
    }

    .card {
      padding: 16px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .section-head h2,
    .section-head h3,
    .card h2,
    .card h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .stack {
      display: grid;
      gap: 9px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row.wrap {
      flex-wrap: wrap;
    }

    .row > * {
      min-width: 0;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #F5F6FA;
      color: var(--text);
      font: inherit;
      padding: 12px 14px;
      min-height: 50px;
      outline: none;
      box-shadow: none;
      font-weight: 700;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    input[readonly],
    input:disabled {
      background: #F5F6FA;
      color: var(--muted);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    button {
      border: 0;
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 900;
      min-height: 48px;
      padding: 11px 16px;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 12px 24px rgba(122, 31, 43, 0.18);
    }

    button.primary:active {
      background: var(--primary-dark);
    }

    button.danger {
      color: var(--danger);
      border-color: transparent;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    button.ghost {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      color: var(--text);
    }

    .topbar button.ghost {
      background: rgba(255, 255, 255, 0.82);
      box-shadow: var(--shadow-soft);
      padding-inline: 14px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .actions button {
      flex: 1 1 auto;
    }

    .preview-actions {
      display: grid;
      grid-template-columns: 0.85fr 1fr 1fr;
      gap: 6px;
    }

    .preview-actions button {
      min-width: 0;
      min-height: 38px;
      padding: 8px 8px;
      font-size: 11px;
      line-height: 1.15;
      white-space: normal;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .step {
      border-radius: var(--radius-pill);
      border: 0;
      background: var(--surface);
      color: var(--muted);
      padding: 9px 6px;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      box-shadow: var(--shadow-soft);
    }

    button.step {
      min-height: 38px;
      cursor: pointer;
    }

    .step.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .step.disabled,
    button.step:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      box-shadow: none;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .list-card {
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-inner);
      background: var(--surface);
      padding: 12px;
      display: grid;
      gap: 8px;
      box-shadow: var(--shadow-soft);
    }

    .list-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .name {
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      background: rgba(16, 185, 129, 0.12);
      color: #047857;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .autocomplete {
      position: relative;
      display: grid;
      gap: 7px;
    }

    .autocomplete-list {
      border: 1px solid var(--line);
      border-radius: var(--radius-inner);
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .autocomplete-option {
      width: 100%;
      min-height: 0;
      display: block;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 11px 14px;
      text-align: start;
      background: var(--surface);
      box-shadow: none;
      font-weight: 400;
      cursor: pointer;
    }

    .autocomplete-option:last-child {
      border-bottom: 0;
    }

    .autocomplete-option span {
      display: block;
    }

    .autocomplete-option.active,
    .autocomplete-option:hover {
      background: #F5F6FA;
    }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .recent-items-panel {
      display: grid;
      gap: 7px;
      padding: 10px;
      border-radius: var(--radius-inner);
      background: #F5F6FA;
    }

    .suggested-items-panel {
      padding: 9px;
      border-radius: var(--radius-inner);
      background: var(--bg);
      border: 1px solid var(--glass-border);
    }

    .recent-items-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .suggested-items-panel .recent-items-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .recent-item-tag {
      min-height: 30px;
      max-width: 100%;
      padding: 6px 10px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-soft);
      font-size: 11px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-item-tag:active {
      background: var(--primary);
      color: #fff;
    }

    .suggested-item-tag {
      min-height: 32px;
      max-width: 100%;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
      font-size: 10.5px;
      font-weight: 900;
      white-space: nowrap;
    }

    .suggested-item-tag:active {
      background: var(--primary);
      color: #fff;
    }

    .suggested-item-tag-name {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggested-item-tag-price {
      color: var(--primary);
      font-weight: 900;
    }

    .suggested-item-tag:active .suggested-item-tag-price {
      color: #fff;
    }

    .item-action-col {
      width: 52px;
      text-align: center;
    }

    .line-remove-btn,
    .line-add-btn {
      width: 28px;
      min-height: 28px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      box-shadow: none;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
    }

    .line-add-btn {
      background: var(--success);
      color: #fff;
    }

    .line-remove-btn {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
    }

    .items-add-row td {
      text-align: right;
      background: #F5F6FA;
    }

    .add-item-modal {
      width: min(100%, 420px);
    }

    .company-profile-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 4px;
    }

    .company-profile-tab {
      min-height: 36px;
      padding: 7px 8px;
      border: 0;
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-soft);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .company-profile-tab.active {
      background: var(--primary);
      color: #fff;
    }

    .status-tag {
      flex: 1 1 110px;
      border-color: transparent;
      color: var(--text);
      background: var(--surface);
    }

    .status-tag.active {
      background: rgba(16, 185, 129, 0.12);
      border-color: transparent;
      color: #047857;
    }

    .customer-type-tags .status-tag.active {
      background: var(--primary);
      color: #fff;
    }

    .status-tag.status-unpaid.active,
    .status-tag.status-overdue.active,
    .pill.status-unpaid,
    .pill.status-overdue {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
    }

    .status-tag.status-paid.active,
    .status-tag.status-partial.active,
    .pill.status-paid,
    .pill.status-partial {
      background: var(--success);
      color: #fff;
    }

    .payment-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .payment-summary .meta-cell {
      background: #F5F6FA;
    }

    .payment-modal {
      width: min(100%, 360px);
      max-height: calc(100dvh - 28px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .payment-method-tags .status-tag {
      flex: 1 1 95px;
      min-height: 40px;
    }

    .payment-method-tags .status-tag.active {
      background: var(--primary);
      color: #fff;
    }

    .table-wrap {
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-inner);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .table-wrap table {
      width: 100%;
      min-width: 0;
      table-layout: fixed;
    }

    .table-wrap table th,
    .table-wrap table td {
      min-width: 0;
      padding: 6px 3px;
      font-size: 10px;
      line-height: 1.15;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .table-wrap table th:first-child,
    .table-wrap table td:first-child {
      min-width: 0;
    }

    function applyPwaIcons() {
      const iconLinks = [
        { rel: "apple-touch-icon" },
        { rel: "icon", type: "image/png" },
        { rel: "shortcut icon", type: "image/png" }
      ];

      iconLinks.forEach(config => {
        const link = document.createElement("link");
        Object.entries(config).forEach(([key, value]) => link.setAttribute(key, value));
        link.href = BRAND_LOGO_DATA_URL;
        document.head.appendChild(link);
      });
    }

    function applyWebAppManifest() {
      const manifest = {
        name: "Zaki Invoice",
        short_name: "Zaki",
        start_url: ".",
        display: "standalone",
        background_color: "#F7F4F1",
        theme_color: "#7A1F2B",
        icons: [
          {
            src: BRAND_LOGO_DATA_URL,
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };

      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      const manifestUrl = URL.createObjectURL(blob);
      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = manifestUrl;
      document.head.appendChild(link);
    }

    function isIosDevice() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent || "") ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function isSafariBrowser() {
      const ua = navigator.userAgent || "";
      return /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
    }

    function isStandaloneMode() {
      return window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
    }

    function shouldShowIosInstallPrompt() {
      if (!isIosDevice()) return false;
      if (!isSafariBrowser()) return false;
      if (isStandaloneMode()) return false;
      return localStorage.getItem("zaki-invoice.iosInstallDismissed") !== "1";
    }

    function isPastDue(dateValue) {
      return Boolean(dateValue && dateValue < today());

    function storedPayments(source) {
      return Array.isArray(source?.payments)
        ? source.payments
            .map(payment => ({
              id: payment.id || uid("payment"),
              receiptNo: payment.receiptNo || "",
              date: payment.date || payment.paymentDate || "",
              amount: Math.max(0, numberValue(payment.amount ?? payment.paymentAmount, 0)),
              method: payment.method || payment.paymentMethod || "",
              note: payment.note || ""
            }))
            .filter(payment => payment.amount > 0)
        : [];
    }

    function paymentPaidAmount(source) {
      const payments = storedPayments(source);
      if (payments.length) return payments.reduce((sum, payment) => sum + payment.amount, 0);
      return Math.max(0, numberValue(source?.paidAmount, 0));
    }

    function latestPaymentMethod(source) {
      const payments = storedPayments(source);
      if (payments.length) return payments[payments.length - 1].method || "";
      return String(source?.paymentMethod || "");
    }

    function getInvoicePayments(invoice, grandTotal = null) {
      const payments = storedPayments(invoice);
      if (payments.length) return payments;
      const total = grandTotal === null ? totalsForInvoice(invoice).grand : Math.max(0, numberValue(grandTotal, 0));
      const fallbackAmount = paymentState(invoice, total).paidAmount;
      if (fallbackAmount <= 0) return [];
      return [{
        id: "legacy-paid-amount",
        receiptNo: "",
        date: invoice.paymentDate || invoice.date || "",
        amount: fallbackAmount,
        method: invoice.paymentMethod || "",
        note: ""
      }];
    }

    function paymentReceiptNo(invoice, payment, index) {
      return payment?.receiptNo || `${invoice?.number || "INV"}-R${String(index + 1).padStart(3, "0")}`;
    }

    function paymentBaseStatus(source, grandTotal) {
      const explicit = ["paid", "partial", "unpaid"].includes(source?.paymentStatus) ? source.paymentStatus : "unpaid";
      const total = Math.max(0, numberValue(grandTotal, 0));
      const paid = paymentPaidAmount(source);
      if (explicit === "paid") return "paid";
      if (total > 0 && paid >= total) return "paid";
      if (paid > 0) return "partial";
      return "unpaid";
    }

    function paymentState(source, grandTotal) {
      const total = Math.max(0, numberValue(grandTotal, 0));
      const baseStatus = paymentBaseStatus(source, total);
      const displayStatus = baseStatus !== "paid" && isPastDue(source?.dueDate) ? "overdue" : baseStatus;
      let paidAmount = paymentPaidAmount(source);
      if (baseStatus === "paid" && (total > 0 || source?.paymentStatus === "paid")) paidAmount = total;
      if (baseStatus === "unpaid") paidAmount = 0;
      return {
        baseStatus,
        displayStatus,
        paymentStatus: displayStatus,
        paymentMethod: baseStatus === "unpaid" ? "" : latestPaymentMethod(source),
        paidAmount
      };
    }

    function paymentStateForSave(source, grandTotal) {
      const state = paymentState(source, grandTotal);
      const total = Math.max(0, numberValue(grandTotal, 0));
      if (state.baseStatus === "paid") {
        state.paidAmount = total;
      }
      if (state.baseStatus === "unpaid") {
        state.paidAmount = 0;
        state.paymentMethod = "";
      }
      return state;
    }

      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return date.getFullYear() + "-" + month + "-" + day;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    function escapeJsString(value) {

        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")

    function numberToWordsEnglish(value) {
      const number = Math.floor(Math.abs(numberValue(value, 0)));
      const ones = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
      const tens = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
      if (number < 20) return ones[number];
      if (number < 100) return tens[Math.floor(number / 10)] + (number % 10 ? " " + ones[number % 10] : "");
      if (number < 1000) return ones[Math.floor(number / 100)] + " Hundred" + (number % 100 ? " " + numberToWordsEnglish(number % 100) : "");
      if (number < 1000000) return numberToWordsEnglish(Math.floor(number / 1000)) + " Thousand" + (number % 1000 ? " " + numberToWordsEnglish(number % 1000) : "");
      if (number < 1000000000) return numberToWordsEnglish(Math.floor(number / 1000000)) + " Million" + (number % 1000000 ? " " + numberToWordsEnglish(number % 1000000) : "");
      return number.toLocaleString("en-US");
    }

    function amountToWordsEnglish(amount) {
      const safeAmount = Math.max(0, numberValue(amount, 0));
      const totalHalalas = Math.round(safeAmount * 100);
      const riyals = Math.floor(totalHalalas / 100);
      const halalas = totalHalalas % 100;
      const riyalWords = numberToWordsEnglish(riyals) + " Saudi Riyals";
      if (halalas > 0) return riyalWords + " and " + numberToWordsEnglish(halalas) + " Halalas only";
      return riyalWords + " only";
    }

    function numberToWordsArabic(value) {
      const number = Math.floor(Math.abs(numberValue(value, 0)));
      const ones = ["\u0635\u0641\u0631", "\u0648\u0627\u062d\u062f", "\u0627\u062b\u0646\u0627\u0646", "\u062b\u0644\u0627\u062b\u0629", "\u0623\u0631\u0628\u0639\u0629", "\u062e\u0645\u0633\u0629", "\u0633\u062a\u0629", "\u0633\u0628\u0639\u0629", "\u062b\u0645\u0627\u0646\u064a\u0629", "\u062a\u0633\u0639\u0629", "\u0639\u0634\u0631\u0629", "\u0623\u062d\u062f \u0639\u0634\u0631", "\u0627\u062b\u0646\u0627 \u0639\u0634\u0631", "\u062b\u0644\u0627\u062b\u0629 \u0639\u0634\u0631", "\u0623\u0631\u0628\u0639\u0629 \u0639\u0634\u0631", "\u062e\u0645\u0633\u0629 \u0639\u0634\u0631", "\u0633\u062a\u0629 \u0639\u0634\u0631", "\u0633\u0628\u0639\u0629 \u0639\u0634\u0631", "\u062b\u0645\u0627\u0646\u064a\u0629 \u0639\u0634\u0631", "\u062a\u0633\u0639\u0629 \u0639\u0634\u0631"];
      const tens = ["", "", "\u0639\u0634\u0631\u0648\u0646", "\u062b\u0644\u0627\u062b\u0648\u0646", "\u0623\u0631\u0628\u0639\u0648\u0646", "\u062e\u0645\u0633\u0648\u0646", "\u0633\u062a\u0648\u0646", "\u0633\u0628\u0639\u0648\u0646", "\u062b\u0645\u0627\u0646\u0648\u0646", "\u062a\u0633\u0639\u0648\u0646"];
      const hundreds = ["", "\u0645\u0626\u0629", "\u0645\u0626\u062a\u0627\u0646", "\u062b\u0644\u0627\u062b\u0645\u0626\u0629", "\u0623\u0631\u0628\u0639\u0645\u0626\u0629", "\u062e\u0645\u0633\u0645\u0626\u0629", "\u0633\u062a\u0645\u0626\u0629", "\u0633\u0628\u0639\u0645\u0626\u0629", "\u062b\u0645\u0627\u0646\u0645\u0626\u0629", "\u062a\u0633\u0639\u0645\u0626\u0629"];
      const underHundred = n => {
        if (n < 20) return ones[n];
        const unit = n % 10;
        const ten = Math.floor(n / 10);
        return unit ? ones[unit] + " \u0648" + tens[ten] : tens[ten];
      };
      const underThousand = n => {
        if (n < 100) return underHundred(n);
        const hundred = Math.floor(n / 100);
        const rest = n % 100;
        return hundreds[hundred] + (rest ? " \u0648" + underHundred(rest) : "");
      };
      const scaleWords = (count, singular, dual, plural) => {
        if (count === 1) return singular;
        if (count === 2) return dual;
        if (count <= 10) return underThousand(count) + " " + plural;
        return underThousand(count) + " " + singular;
      };
      if (number < 1000) return underThousand(number);
      if (number < 1000000) {
        const count = Math.floor(number / 1000);
        const rest = number % 1000;
        return scaleWords(count, "\u0623\u0644\u0641", "\u0623\u0644\u0641\u0627\u0646", "\u0622\u0644\u0627\u0641") + (rest ? " \u0648" + underThousand(rest) : "");
      }
      if (number < 1000000000) {
        const count = Math.floor(number / 1000000);
        const rest = number % 1000000;
        return scaleWords(count, "\u0645\u0644\u064a\u0648\u0646", "\u0645\u0644\u064a\u0648\u0646\u0627\u0646", "\u0645\u0644\u0627\u064a\u064a\u0646") + (rest ? " \u0648" + numberToWordsArabic(rest) : "");
      }
      return number.toLocaleString("ar-SA");
    }

    function amountToWordsArabic(amount) {

      const totalHalalas = Math.round(safeAmount * 100);
      const riyals = Math.floor(totalHalalas / 100);
      const halalas = totalHalalas % 100;
      const riyalWords = numberToWordsArabic(riyals) + " \u0631\u064a\u0627\u0644 \u0633\u0639\u0648\u062f\u064a";
      if (halalas > 0) return riyalWords + " \u0648" + numberToWordsArabic(halalas) + " \u0647\u0644\u0644\u0629 \u0641\u0642\u0637";
      return riyalWords + " \u0641\u0642\u0637";

      return db.invoices.filter(invoice => {
        const invoiceCustomer = invoice.customer || {};
        if (id && (invoice.customerId === id || invoiceCustomer.id === id)) return true;
        if (vat && invoiceCustomer.vat === vat) return true;
        return !id && !vat && name && invoiceCustomer.name === name;
      });
    }

    function customerProfileStats(customer) {
      const invoices = invoicesForCustomer(customer);
      const outstanding = invoices.reduce((sum, invoice) => {
        const totals = totalsForInvoice(invoice);
        const payment = paymentState(invoice, totals.grand);
        return sum + Math.max(0, totals.grand - payment.paidAmount);
      }, 0);
      const dates = invoices
        .map(invoice => invoice.date)
        .filter(Boolean)
        .sort();
      const lastDate = dates[dates.length - 1] || "";
      return {
        totalInvoices: invoices.length,
        outstanding,
        lastDate,
        active: invoices.length > 0
      };
    }

    function customerStatementIdentity(customer) {
      return [
        customer?.vat,
        customer?.nationalId,
        customer?.crNumber
      ].map(value => String(value || "").trim()).filter(Boolean);
    }

    function invoiceBelongsToCustomer(invoice, customer) {
      if (!invoice || !customer) return false;
      const invoiceCustomer = invoice.customer || {};
      const customerId = String(customer.id || "").trim();
      const invoiceCustomerId = String(invoiceCustomer.id || invoice.customerId || "").trim();
      if (customerId && (invoice.customerId === customerId || invoiceCustomerId === customerId)) return true;

      const customerIdentities = new Set(customerStatementIdentity(customer));
      const invoiceIdentities = customerStatementIdentity(invoiceCustomer);
      if (invoiceIdentities.some(value => customerIdentities.has(value))) return true;

      const customerName = String(customer.name || "").trim().toLowerCase();
      const invoiceCustomerName = String(invoiceCustomer.name || "").trim().toLowerCase();
      const noCustomerIdentity = customerIdentities.size === 0;
      const noInvoiceIdentity = invoiceIdentities.length === 0 && !invoiceCustomerId;
      return noCustomerIdentity && noInvoiceIdentity && customerName && customerName === invoiceCustomerName;
    }

    function customerStatementInvoices(customer) {
      return db.invoices.filter(invoice => invoiceBelongsToCustomer(invoice, customer));
    }

    function customerStatementTransactions(customer) {
      const rows = [];
      customerStatementInvoices(customer).forEach(invoice => {
        const totals = totalsForInvoice(invoice);
        rows.push({
          date: invoice.date || "",
          sortOrder: 0,
          type: "invoice",
          typeText: `${t("invoice")} ${invoice.number || ""}`.trim(),
          printTypeText: `Invoice ${invoice.number || ""}`.trim(),
          debit: totals.grand,
          credit: 0,
          balance: 0,
          invoice
        });
        getInvoicePayments(invoice, totals.grand).forEach((payment, index) => {
          const receiptNo = paymentReceiptNo(invoice, payment, index);
          rows.push({
            date: payment.date || invoice.date || "",
            sortOrder: 1,
            type: "payment",
            typeText: `${t("payment")} ${receiptNo || invoice.number || ""}`.trim(),
            printTypeText: `Payment ${receiptNo || invoice.number || ""}`.trim(),
            debit: 0,
            credit: Math.max(0, numberValue(payment.amount, 0)),
            balance: 0,
            invoice,
            payment,
            receiptNo
          });
        });
      });
      rows.sort((a, b) => {
        const dateCompare = String(a.date || "").localeCompare(String(b.date || ""));
        if (dateCompare) return dateCompare;
        return a.sortOrder - b.sortOrder;
      });
      let runningBalance = 0;
      return rows.map(row => {
        runningBalance += row.debit - row.credit;
        return { ...row, balance: runningBalance };
      });
    }

    function customerStatementTotals(transactions) {
      const totalDebit = transactions.reduce((sum, row) => sum + row.debit, 0);
      const totalCredit = transactions.reduce((sum, row) => sum + row.credit, 0);
      return {
        totalDebit,
        totalCredit,
        endingBalance: totalDebit - totalCredit
      };
    }

    function statementRowsWithRunningBalance(rows) {
      let runningBalance = 0;
      return rows.map(row => {
        runningBalance += row.debit - row.credit;
        return { ...row, balance: runningBalance };
      });
    }

    function filterStatementTransactionsByDate(transactions, fromDate = "", toDate = "") {
      const from = String(fromDate || "").trim();
      const to = String(toDate || "").trim();
      if (!from && !to) return transactions;
      const filtered = transactions.filter(row => {
        const date = String(row.date || "").trim();
        if (!date) return false;
        if (from && date < from) return false;
        if (to && date > to) return false;
        return true;
      });
      return statementRowsWithRunningBalance(filtered);
    }

    function updateStatementDateFilter(field, value) {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      if (field === "from") modalContext.statementDateFrom = value;
      if (field === "to") modalContext.statementDateTo = value;
      const customer = findCustomerProfileSource(modalContext.id, modalContext.invoiceId);
      if (!customer) return;
      document.getElementById("modalRoot").innerHTML = renderCustomerStatementPreview(customer, modalContext.id, modalContext.invoiceId);
    }

    function clearStatementDateFilter() {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      modalContext.statementDateFrom = "";
      modalContext.statementDateTo = "";
      modalContext.statementQuickRange = "all_time";
      const customer = findCustomerProfileSource(modalContext.id, modalContext.invoiceId);
      if (!customer) return;
      document.getElementById("modalRoot").innerHTML = renderCustomerStatementPreview(customer, modalContext.id, modalContext.invoiceId);
    }

    function parseStatementDate(dateStr) {
      const parts = String(dateStr || "").split("-").map(Number);
      if (parts.length !== 3 || parts.some(part => !Number.isFinite(part))) return null;
      return new Date(parts[0], parts[1] - 1, parts[2]);
    }

    function formatStatementDate(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "";
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day}`;
    }

    function statementQuickRangeLabel(type) {
      const labels = {
        last_month: "lastMonth",
        last_60_days: "last60Days",
        last_90_days: "last90Days",
        all_time: "allTime",
        custom_range: "customRange"
      };
      return t(labels[type] || "customRange");
    }

    function statementCalendarIconSvg() {
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4"></path><path d="M17 3v4"></path><path d="M4 8h16"></path><path d="M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path></svg>`;
    }

    function statementChevronSvg(direction = "down") {
      const paths = {
        down: "m6 9 6 6 6-6",
        left: "m15 18-6-6 6-6",
        right: "m9 18 6-6-6-6"
      };
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[direction] || paths.down}"></path></svg>`;
    }

    function getStatementDateFilterSummary(fromDate, toDate) {
      const from = String(fromDate || "").trim();
      const to = String(toDate || "").trim();
      const quickRange = modalContext?.type === "customer-statement" ? modalContext.statementQuickRange || "" : "";
      if (!from && !to) return t("noDateFilter");
      if (["last_month", "last_60_days", "last_90_days"].includes(quickRange)) return statementQuickRangeLabel(quickRange);
      const connector = state.lang === "ar" ? "إلى" : "to";
      return `${from || "-"} ${connector} ${to || "-"}`;
    }

    function firstDayOfStatementMonth(dateStr = "") {
      const date = parseStatementDate(dateStr) || parseStatementDate(today());
      return formatStatementDate(new Date(date.getFullYear(), date.getMonth(), 1));
    }

    function openStatementDateFilterPopup() {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      closeStatementDateFilterPopup();
      modalContext.tempStatementDateFrom = modalContext.statementDateFrom || "";
      modalContext.tempStatementDateTo = modalContext.statementDateTo || "";
      modalContext.tempStatementQuickRange = modalContext.statementQuickRange || (modalContext.tempStatementDateFrom || modalContext.tempStatementDateTo ? "custom_range" : "all_time");
      modalContext.statementCalendarMonth = firstDayOfStatementMonth(modalContext.tempStatementDateFrom || modalContext.tempStatementDateTo || modalContext.statementCalendarMonth || today());
      document.getElementById("modalRoot").insertAdjacentHTML("beforeend", renderStatementDateFilterPopup());
    }

    function renderStatementDateFilterPopup() {
      const fromDate = modalContext?.tempStatementDateFrom || modalContext?.statementDateFrom || "";
      const toDate = modalContext?.tempStatementDateTo || modalContext?.statementDateTo || "";
      const activeQuick = modalContext?.tempStatementQuickRange || modalContext?.statementQuickRange || (fromDate || toDate ? "custom_range" : "all_time");
      const quickItems = [
        { type: "last_month", label: t("lastMonth") },
        { type: "last_60_days", label: t("last60Days") },
        { type: "last_90_days", label: t("last90Days") },
        { type: "all_time", label: t("allTime") },
        { type: "custom_range", label: t("customRange") }
      ];
      const calendarMonth = modalContext?.statementCalendarMonth || firstDayOfStatementMonth(fromDate || toDate || today());
      return `
        <div class="statement-date-filter-layer" onclick="closeStatementDateFilterPopup()">
          <form class="statement-date-filter-popover" role="dialog" aria-modal="true" onsubmit="applyStatementDateFilter(event)" onclick="event.stopPropagation()">
            <div class="statement-date-filter-layout">
              <aside class="statement-date-filter-sidebar">
                <div class="statement-date-filter-quick-list">
                  ${quickItems.map(item => `
                    <button type="button" class="statement-date-filter-quick-item ${activeQuick === item.type ? "active" : ""}" onclick="setStatementQuickRange('${item.type}')">
                      <span>${escapeHtml(item.label)}</span>
                      ${item.type === "custom_range" ? statementChevronSvg(state.lang === "ar" ? "left" : "right") : ""}
                    </button>
                  `).join("")}
                </div>
              </aside>
              <section class="statement-date-filter-main">
                <div class="statement-date-filter-tabs">
                  <button type="button" class="statement-date-filter-tab active">${t("inBetween")}</button>
                </div>
                <div class="statement-date-input-row">
                  <div class="statement-date-input ${!toDate ? "active" : ""}">
                    <label>${t("statementFromDate")}
                      <input type="date" name="fromDate" value="${escapeHtml(fromDate)}" onchange="updateStatementTempDate('from', this.value)">
                    </label>
                  </div>
                  <span class="statement-date-and">${t("and")}</span>
                  <div class="statement-date-input ${fromDate && !toDate ? "active" : ""}">
                    <label>${t("statementToDate")}
                      <input type="date" name="toDate" value="${escapeHtml(toDate)}" onchange="updateStatementTempDate('to', this.value)">
                    </label>
                  </div>
                </div>
                <div class="statement-calendar-wrap">
                  ${renderStatementCalendarGrid(calendarMonth, fromDate, toDate)}
                </div>
                <div class="statement-date-filter-actions">
                  <button class="statement-cancel" type="button" onclick="closeStatementDateFilterPopup()">${t("cancel")}</button>
                  <button class="statement-apply" type="submit">${t("applyRange")}</button>
                </div>
              </section>
            </div>
          </form>
        </div>
      `;
    }

    function closeStatementDateFilterPopup() {
      document.querySelector(".statement-date-filter-layer")?.remove();
    }

    function refreshStatementDateFilterPopup() {
      const layer = document.querySelector(".statement-date-filter-layer");
      if (layer) layer.outerHTML = renderStatementDateFilterPopup();
    }

    function setStatementQuickRange(type) {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      const base = parseStatementDate(today());
      modalContext.tempStatementQuickRange = type;
      if (type === "last_month") {
        const first = new Date(base.getFullYear(), base.getMonth() - 1, 1);
        const last = new Date(base.getFullYear(), base.getMonth(), 0);
        modalContext.tempStatementDateFrom = formatStatementDate(first);
        modalContext.tempStatementDateTo = formatStatementDate(last);
        modalContext.statementCalendarMonth = firstDayOfStatementMonth(modalContext.tempStatementDateFrom);
      } else if (type === "last_60_days") {
        const from = new Date(base);
        from.setDate(base.getDate() - 59);
        modalContext.tempStatementDateFrom = formatStatementDate(from);
        modalContext.tempStatementDateTo = formatStatementDate(base);
        modalContext.statementCalendarMonth = firstDayOfStatementMonth(modalContext.tempStatementDateFrom);
      } else if (type === "last_90_days") {
        const from = new Date(base);
        from.setDate(base.getDate() - 89);
        modalContext.tempStatementDateFrom = formatStatementDate(from);
        modalContext.tempStatementDateTo = formatStatementDate(base);
        modalContext.statementCalendarMonth = firstDayOfStatementMonth(modalContext.tempStatementDateFrom);
      } else if (type === "all_time") {
        modalContext.tempStatementDateFrom = "";
        modalContext.tempStatementDateTo = "";
        modalContext.statementCalendarMonth = firstDayOfStatementMonth(today());
      } else {
        modalContext.statementCalendarMonth = firstDayOfStatementMonth(modalContext.tempStatementDateFrom || modalContext.tempStatementDateTo || today());
      }
      refreshStatementDateFilterPopup();
    }

    function updateStatementTempDate(field, value) {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      if (field === "from") modalContext.tempStatementDateFrom = value;
      if (field === "to") modalContext.tempStatementDateTo = value;
      modalContext.tempStatementQuickRange = value ? "custom_range" : (modalContext.tempStatementDateFrom || modalContext.tempStatementDateTo ? "custom_range" : "all_time");
      if (value) modalContext.statementCalendarMonth = firstDayOfStatementMonth(value);
      refreshStatementDateFilterPopup();
    }

    function isDateWithinRange(dateStr, fromDate, toDate) {
      const date = String(dateStr || "");
      const from = String(fromDate || "");
      const to = String(toDate || "");
      if (from && to) return date >= from && date <= to;
      return false;
    }

    function buildStatementCalendarMonth(baseDate, fromDate, toDate) {
      const base = parseStatementDate(baseDate) || parseStatementDate(fromDate) || parseStatementDate(toDate) || parseStatementDate(today());
      const first = new Date(base.getFullYear(), base.getMonth(), 1);
      const start = new Date(first);
      start.setDate(first.getDate() - first.getDay());
      const cells = Array.from({ length: 42 }, (_, index) => {
        const cellDate = new Date(start);
        cellDate.setDate(start.getDate() + index);
        const dateStr = formatStatementDate(cellDate);
        return {
          dateStr,
          day: cellDate.getDate(),
          muted: cellDate.getMonth() !== first.getMonth(),
          inRange: isDateWithinRange(dateStr, fromDate, toDate),
          rangeStart: fromDate && dateStr === fromDate,
          rangeEnd: toDate && dateStr === toDate
        };
      });
      const title = new Intl.DateTimeFormat(state.lang === "ar" ? "ar-SA" : "en-US", { month: "long", year: "numeric" }).format(first);
      return { title, cells };
    }

    function renderStatementCalendarGrid(baseDate, fromDate, toDate) {
      const month = buildStatementCalendarMonth(baseDate, fromDate, toDate);
      const weekdays = state.lang === "ar"
        ? ["ح", "ن", "ث", "ر", "خ", "ج", "س"]
        : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      return `
        <div class="statement-calendar-head">
          <button type="button" class="statement-calendar-nav" onclick="shiftStatementCalendarMonth(-1)">${statementChevronSvg(state.lang === "ar" ? "right" : "left")}</button>
          <div class="statement-calendar-title">${escapeHtml(month.title)}</div>
          <button type="button" class="statement-calendar-nav" onclick="shiftStatementCalendarMonth(1)">${statementChevronSvg(state.lang === "ar" ? "left" : "right")}</button>
        </div>
        <div class="statement-calendar-weekdays">
          ${weekdays.map(day => `<span>${escapeHtml(day)}</span>`).join("")}
        </div>
        <div class="statement-calendar-grid">
          ${month.cells.map(cell => `
            <button type="button" class="statement-calendar-cell ${cell.muted ? "muted" : ""} ${cell.inRange ? "in-range" : ""} ${cell.rangeStart ? "range-start" : ""} ${cell.rangeEnd ? "range-end" : ""}" onclick="selectStatementCalendarDate('${cell.dateStr}')">
              ${cell.day}
            </button>
          `).join("")}
        </div>
      `;
    }

    function shiftStatementCalendarMonth(offset) {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      const base = parseStatementDate(modalContext.statementCalendarMonth) || parseStatementDate(today());
      const next = new Date(base.getFullYear(), base.getMonth() + offset, 1);
      modalContext.statementCalendarMonth = formatStatementDate(next);
      refreshStatementDateFilterPopup();
    }

    function selectStatementCalendarDate(dateStr) {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      const from = modalContext.tempStatementDateFrom || "";
      const to = modalContext.tempStatementDateTo || "";
      if (!from || (from && to)) {
        modalContext.tempStatementDateFrom = dateStr;
        modalContext.tempStatementDateTo = "";
      } else if (dateStr < from) {
        modalContext.tempStatementDateFrom = dateStr;
        modalContext.tempStatementDateTo = from;
      } else {
        modalContext.tempStatementDateTo = dateStr;
      }
      modalContext.tempStatementQuickRange = "custom_range";
      modalContext.statementCalendarMonth = firstDayOfStatementMonth(dateStr);
      refreshStatementDateFilterPopup();
    }

    function applyStatementDateFilter(event) {
      event.preventDefault();
      if (!modalContext || modalContext.type !== "customer-statement") return;
      const data = new FormData(event.target);
      modalContext.statementDateFrom = String(data.get("fromDate") || "");
      modalContext.statementDateTo = String(data.get("toDate") || "");
      modalContext.statementQuickRange = modalContext.tempStatementQuickRange || (modalContext.statementDateFrom || modalContext.statementDateTo ? "custom_range" : "all_time");
      if (!modalContext.statementDateFrom && !modalContext.statementDateTo) modalContext.statementQuickRange = "all_time";
      const customer = findCustomerProfileSource(modalContext.id, modalContext.invoiceId);
      if (!customer) return;
      document.getElementById("modalRoot").innerHTML = renderCustomerStatementPreview(customer, modalContext.id, modalContext.invoiceId);
    }

    function clearStatementDateFilterFromPopup() {
      if (!modalContext || modalContext.type !== "customer-statement") return;
      modalContext.tempStatementDateFrom = "";
      modalContext.tempStatementDateTo = "";
      modalContext.tempStatementQuickRange = "all_time";
      modalContext.statementDateFrom = "";
      modalContext.statementDateTo = "";
      modalContext.statementQuickRange = "all_time";
      const customer = findCustomerProfileSource(modalContext.id, modalContext.invoiceId);
      if (!customer) return;
      document.getElementById("modalRoot").innerHTML = renderCustomerStatementPreview(customer, modalContext.id, modalContext.invoiceId);
    }

    function openCustomerStatement(customerId = "", invoiceId = "") {
      const customer = findCustomerProfileSource(customerId, invoiceId);
      if (!customer) return;
      state.customerActionMenu = null;
      state.invoiceActionMenu = null;
      state.paymentActionMenu = null;
      modalContext = {
        type: "customer-statement",
        id: customerId,
        invoiceId,
        statementDateFrom: "",
        statementDateTo: "",
        tempStatementDateFrom: "",
        tempStatementDateTo: "",
        statementQuickRange: "",
        statementCalendarMonth: ""
      };
      document.getElementById("modalRoot").innerHTML = renderCustomerStatementPreview(customer, customerId, invoiceId);
    }

    function renderCustomerStatementPreview(customer, customerId = "", invoiceId = "") {
      const allTransactions = customerStatementTransactions(customer);
      const fromDate = modalContext?.type === "customer-statement" ? modalContext.statementDateFrom || "" : "";
      const toDate = modalContext?.type === "customer-statement" ? modalContext.statementDateTo || "" : "";
      const transactions = filterStatementTransactionsByDate(allTransactions, fromDate, toDate);
      const totals = customerStatementTotals(transactions);
      const rows = transactions.map(row => `
        <tr>
          <td>${escapeHtml(row.date || "")}</td>
          <td>${escapeHtml(row.typeText)}</td>
          <td class="num">${row.debit ? money(row.debit) : ""}</td>
          <td class="num">${row.credit ? money(row.credit) : ""}</td>
          <td class="num">${money(row.balance)}</td>
        </tr>
      `).join("");
      return `
        <div class="modal-backdrop profile-backdrop" onclick="closeModal()">
          <div class="statement-card" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
            <div class="profile-top">
              <div class="profile-heading">
                <h2>${t("statementOfAccount")}</h2>
                <div class="small muted">${escapeHtml(displayValue(customer.name))}</div>
              </div>
              <button class="profile-close" type="button" aria-label="${t("close")}" onclick="closeModal()">X</button>
            </div>
            <div class="statement-header">
              <div class="statement-meta-grid">
                <div class="statement-meta-card">
                  <span class="profile-label">${t("customerName")}</span>
                  <strong>${escapeHtml(displayValue(customer.name))}</strong>
                </div>
                <div class="statement-meta-card">
                  <span class="profile-label">${t("transactions")}</span>
                  <strong>${fromDate || toDate ? t("filteredTransactions") : t("allTransactions")} (${transactions.length})</strong>
                </div>
                <div class="statement-meta-card">
                  <span class="profile-label">${t("currentBalance")}</span>
                  <strong>${money(totals.endingBalance)}</strong>
                </div>
                <div class="statement-meta-card">
                  <span class="profile-label">${t("vatOrIdNumber")}</span>
                  <strong>${escapeHtml(displayValue(customerTableIdentityValue(customer) || customerIdentityValue(customer)))}</strong>
                </div>
              </div>
            </div>
            <section class="statement-section">
              <h3>${t("customer")}</h3>
              <div class="profile-detail-grid">
                ${renderProfileDetail(t("customerName"), customer.name)}
                ${renderProfileDetail(t("vatOrIdNumber"), customerTableIdentityValue(customer) || customerIdentityValue(customer))}
                ${renderProfileDetail(t("phoneOrMobile"), customerMobile(customer))}
                ${renderProfileDetail(t("address"), compactAddress(customer), true)}
              </div>
            </section>
            <section class="statement-section statement-filter-bar">
              <button type="button" class="statement-range-trigger" onclick="openStatementDateFilterPopup()" aria-label="${t("statementDateFilter")}">
                <span class="statement-range-trigger-icon">${statementCalendarIconSvg()}</span>
                <span class="statement-range-trigger-text">${escapeHtml(getStatementDateFilterSummary(fromDate, toDate))}</span>
                <span class="statement-range-trigger-chevron">${statementChevronSvg("down")}</span>
              </button>
            </section>
            <section class="statement-section">
              <h3>${t("transactions")}</h3>
              ${transactions.length ? `
                <div class="statement-table-wrap">
                  <table class="statement-table">
                    <thead>
                      <tr>
                        <th>${t("date")}</th>
                        <th>${t("type")}</th>
                        <th class="num">${t("debit")}</th>
                        <th class="num">${t("credit")}</th>
                        <th class="num">${t("runningBalance")}</th>
                      </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                  </table>
                </div>
              ` : `<div class="empty">${t("noTransactions")}</div>`}
            </section>
            <div class="totals compact-totals">
              <div class="total-row"><span class="total-label">${t("totalDebit")}</span><span class="total-value">${money(totals.totalDebit)}</span></div>
              <div class="total-row"><span class="total-label">${t("totalCredit")}</span><span class="total-value">${money(totals.totalCredit)}</span></div>
              <div class="total-row grand"><span class="total-label">${t("endingBalance")}</span><span class="total-value">${money(totals.endingBalance)}</span></div>
            </div>
            <div class="actions">
              <button type="button" onclick="closeModal()">${t("close")}</button>
              <button class="primary" type="button" onclick="printCustomerStatement('${escapeJsString(customerId)}', '${escapeJsString(invoiceId)}')">${t("printStatement")}</button>
            </div>
          </div>
        </div>
      `;
    }

    function printCustomerStatement(customerId = "", invoiceId = "") {
      const customer = findCustomerProfileSource(customerId, invoiceId);
      if (!customer) return;
      const allTransactions = customerStatementTransactions(customer);
      const fromDate = modalContext?.type === "customer-statement" ? modalContext.statementDateFrom || "" : "";
      const toDate = modalContext?.type === "customer-statement" ? modalContext.statementDateTo || "" : "";
      const transactions = filterStatementTransactionsByDate(allTransactions, fromDate, toDate);
      const html = renderPrintableCustomerStatement(customer, transactions, { fromDate, toDate });
      document.getElementById("printArea").innerHTML = html;
      openInvoicePrintFrame(html, (customer.name || "customer") + "-statement");
    }

    function customerNameButton(customer, fallback = "", extraClass = "", invoiceId = "") {
      const name = String(customer?.name || fallback || t("notAvailable")).trim();
      const id = customer?.id || "";
      if (!customer?.name || (!id && !invoiceId)) return escapeHtml(name);
      return `<button type="button" class="customer-name-link ${extraClass}" onclick="openCustomerProfile(event, '${escapeJsString(id)}', '${escapeJsString(invoiceId)}')">${escapeHtml(name)}</button>`;
    }

    function invoiceNumberButton(invoice, extraClass = "") {
      const number = String(invoice?.number || t("notAvailable")).trim();

    function renderKeepingFocus() {
      const active = document.activeElement;
      const focusId = active?.dataset?.focusId;
      const start = typeof active?.selectionStart === "number" ? active.selectionStart : null;
      const end = typeof active?.selectionEnd === "number" ? active.selectionEnd : null;
      render();
      if (!focusId || typeof document.querySelector !== "function") return;
      const next = document.querySelector(`[data-focus-id="${focusId}"]`);
      if (!next) return;
      next.focus({ preventScroll: true });
      if (start !== null && typeof next.setSelectionRange === "function") {
        const safeStart = Math.min(start, next.value.length);
        const safeEnd = Math.min(end ?? start, next.value.length);
        next.setSelectionRange(safeStart, safeEnd);
      }
    }

      const total = totalsForInvoice(invoice).grand;
      const payment = paymentState(invoice, total);

    function refreshHomeAddPaymentPicker() {
      if (modalContext?.type !== "home-payment-picker") return;
      const cursor = (modalContext.search || "").length;
      document.getElementById("modalRoot").innerHTML = renderHomeAddPaymentPicker();
      setTimeout(() => {
        const input = document.querySelector('[data-focus-id="home-payment-search"]');
        if (!input) return;
        input.focus({ preventScroll: true });
        if (typeof input.setSelectionRange === "function") input.setSelectionRange(cursor, cursor);
      }, 0);
    }

    function renderHomeAddPaymentPicker() {
      const search = modalContext?.search || "";
      const terms = search.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const payableInvoices = invoicesWithBalance();
      const invoices = [...payableInvoices]
        .filter(invoice => terms.every(term => homePaymentInvoiceSearchText(invoice).includes(term)))
        .sort((a, b) => String(b.createdAt || b.date || "").localeCompare(String(a.createdAt || a.date || "")));
      return `
        <div class="modal-backdrop profile-backdrop" onclick="closeModal()">
          <div class="payment-modal stack" role="dialog" aria-modal="true" onclick="event.stopPropagation()">

              <div class="table-wrap">
                <table class="payment-picker-table">
                  <thead>

                      <th>${t("invShort")}</th>
                      <th>${t("customer")}</th>
                      <th class="num">${t("total")}</th>
                      <th class="num">${t("paid")}</th>
                      <th class="num">${t("balance")}</th>
                      <th>${t("select")}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${invoices.map(invoice => {
                      const total = totalsForInvoice(invoice).grand;
                      const payment = paymentState(invoice, total);
                      const remaining = Math.max(0, total - payment.paidAmount);
                      return `
                        <tr>
                          <td><strong>${escapeHtml(invoice.number || "")}</strong></td>
                          <td>${escapeHtml(invoice.customer?.name || t("noCustomer"))}</td>
                          <td class="num">${money(total)}</td>

              </div>
            ` : `<div class="empty">${t("noInvoicesFound")}</div>`}
