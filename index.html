    function saveSupportTicketLocally(ticket) {
      const key = STORE.supportTickets || "zaki-invoice.supportTickets";
      const savedTickets = readStore(key, []);
      const tickets = Array.isArray(savedTickets) ? savedTickets : [];
      tickets.unshift(ticket);
      localStorage.setItem(key, JSON.stringify(tickets.slice(0, 100)));
    }

    function sendSupportTicketToAdmin(ticket) {
      if (!SUPPORT_TICKET_ENDPOINT) return Promise.reject(new Error("No support endpoint configured"));
      return fetch(SUPPORT_TICKET_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(ticket)
      });
    }

    function sendSupportTicket(event) {
      event.preventDefault();
      const data = new FormData(event.target);
      const issueType = String(data.get("issueType") || modalContext?.issueType || "");
      if (!issueType) return;
      const ticket = buildSupportTicketPayload(issueType, data.get("comment"));
      saveSupportTicketLocally(ticket);
      sendSupportTicketToAdmin(ticket)
        .then(response => {
          if (!response.ok) throw new Error("Support ticket request failed");
          closeModal();
          showAppMessage(t("ticketSent"));
        })
        .catch(() => {
          closeModal();
          showAppMessage(t("ticketSendFailed"));
        });
    }

    function openNewPaymentPicker() {
      openHomeAddPaymentPicker();
    }

    function collectAllPayments() {
      return db.invoices.flatMap(invoice => {
        const total = totalsForInvoice(invoice).grand;
        return getInvoicePayments(invoice, total).map((payment, paymentIndex) => ({
          invoice,
          invoiceId: invoice.id,
          payment,
          paymentIndex,
          receiptNo: paymentReceiptNo(invoice, payment, paymentIndex),
          customerName: invoice.customer?.name || t("noCustomer"),
          amount: Math.max(0, numberValue(payment.amount, 0)),
          method: payment.method || "",
          date: payment.date || invoice.date || ""
        }));
      }).sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    }

    function printPaymentFromPaymentsPage(invoiceId, paymentIndex) {
      const invoice = db.invoices.find(item => item.id === invoiceId);
      const paymentData = paymentRecordPayload(invoice, paymentIndex);
      if (!invoice || !paymentData) return;
      printPaymentReceipt(invoiceId, paymentData);
    }

    function renderPaymentsPage() {
      const payments = collectAllPayments();
      return `
        <div class="grid">
          <section class="card stack">
            <div class="section-head">
              <h2>${t("payments")}</h2>
              <button class="primary" type="button" onclick="openNewPaymentPicker()">${t("addNewPayment")}</button>
            </div>
            ${payments.length ? `
              <div class="table-wrap">
                <table class="payments-table">
                  <thead>
                    <tr>
                      <th>${t("payNoShort")}</th>
                      <th>${t("invShort")}</th>
                      <th>${t("customer")}</th>
                      <th class="num">${t("paymentAmount")}</th>
                      <th>${t("paymentMethod")}</th>
                      <th>${t("actions")}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${payments.map(row => `
                      <tr>
                        <td><strong>${escapeHtml(row.receiptNo)}</strong></td>
                        <td><strong>${invoiceNumberButton(row.invoice)}</strong></td>
                        <td>${customerNameButton(row.invoice.customer, t("noCustomer"), "", row.invoiceId)}</td>
                        <td class="num">${money(row.amount)}</td>
                        <td>${escapeHtml(paymentMethodLabel(row.method))}</td>
                        <td>
                          <button class="menu-dot-button" type="button" aria-label="${t("actions")}" onclick="openPaymentActionMenu(event, '${escapeJsString(row.invoiceId)}', ${row.paymentIndex})">
                            <span class="six-dot" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></span>
                          </button>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="empty">${t("noPaymentsSaved")}</div>`}
          </section>
          ${renderPaymentActionMenu()}
        </div>
      `;
    }

    function openPaymentActionMenu(event, invoiceId, paymentIndex) {
      if (event) event.stopPropagation();
      const rect = event?.currentTarget?.getBoundingClientRect?.();
      const width = 142;
      const viewportWidth = window.innerWidth || 360;
      const viewportHeight = window.innerHeight || 640;
      const left = rect ? Math.min(viewportWidth - width - 10, Math.max(10, rect.right - width)) : 10;
      const top = rect ? Math.min(viewportHeight - 116, Math.max(10, rect.bottom + 6)) : 80;
      state.paymentActionMenu = { invoiceId, paymentIndex, left, top };
      state.invoiceActionMenu = null;
      state.customerActionMenu = null;
      render();
    }

    function closePaymentActionMenu() {
      state.paymentActionMenu = null;
      render();
    }

    function renderPaymentActionMenu() {
      const menu = state.paymentActionMenu;
      if (!menu) return "";
      const invoice = db.invoices.find(item => item.id === menu.invoiceId);
      const canAddPayment = invoice ? invoiceBalance(invoice) > 0 : false;
      return `
        <div class="invoice-menu-scrim" onclick="closePaymentActionMenu()"></div>
        <div class="invoice-row-menu" style="left:${menu.left}px; top:${menu.top}px">
          <button type="button" onclick="runPaymentMenuAction('${escapeJsString(menu.invoiceId)}', ${menu.paymentIndex}, 'print')">${t("printReceipt")}</button>
          <button type="button" onclick="runPaymentMenuAction('${escapeJsString(menu.invoiceId)}', ${menu.paymentIndex}, 'view')">${t("viewInvoice")}</button>
          <button type="button" ${canAddPayment ? "" : "disabled"} onclick="runPaymentMenuAction('${escapeJsString(menu.invoiceId)}', ${menu.paymentIndex}, 'payment')">${t("addPayment")}</button>
        </div>
      `;
    }

    function runPaymentMenuAction(invoiceId, paymentIndex, action) {
      state.paymentActionMenu = null;
      if (action === "print") {
        render();
        printPaymentFromPaymentsPage(invoiceId, paymentIndex);
      }
      if (action === "view") viewInvoice(invoiceId);
      if (action === "payment") {
        const invoice = db.invoices.find(item => item.id === invoiceId);
        if (!invoice || invoiceBalance(invoice) <= 0) {
          render();
          showAppMessage(t("invoiceFullyPaid"));
          return;
        }
        render();
        openAddPaymentModal(invoiceId);
      }
    }

    function dashboardStats() {
      return db.invoices.reduce((stats, invoice) => {
        const totals = totalsForInvoice(invoice);
        const payment = paymentState(invoice, totals.grand);
        stats.totalSales += totals.grand;
        stats.paidAmount += payment.paidAmount;
        stats.outstandingAmount += Math.max(0, totals.grand - payment.paidAmount);
        if (payment.displayStatus === "overdue") stats.overdueCount += 1;
        return stats;
      }, {
        totalInvoices: db.invoices.length,
        totalSales: 0,
        paidAmount: 0,
        outstandingAmount: 0,
        overdueCount: 0
      });
    }

    function renderRecentInvoiceRow(invoice) {
      const totals = totalsForInvoice(invoice);
      const payment = paymentState(invoice, totals.grand);
      const customer = invoice.customer || {};
      return `
        <tr>
          <td>${escapeHtml(invoice.date || "")}</td>
          <td><strong>${invoiceNumberButton(invoice)}</strong></td>
          <td>${customerNameButton(customer, t("noCustomer"), "", invoice.id)}</td>
          <td class="num">${money(totals.grand)}</td>
          <td><span class="pill status-${payment.displayStatus}">${paymentStatusLabel(payment.displayStatus)}</span></td>
        </tr>
      `;
    }

    function startNewInvoice() {
      const numberIndex = Math.max(1, Math.floor(numberValue(db.settings.nextInvoiceNumber, 1)));
      state.draft = {
        editingId: null,
        savedId: null,
        numberIndex,
        numberCommitted: false,
        number: invoiceNumberFromSettings(),
        date: today(),
        deliveryDate: today(),
        dueDate: today(),
        reference: "",
        paymentStatus: "unpaid",
        paymentMethod: "",
        paidAmount: 0,
        invoiceType: "tax",
        invoiceDiscountPercent: 0,
        customerId: "",
        customer: null,
        lines: [],
        timestamp: localInvoiceTimestamp(today())
      };
      state.step = 1;
      state.customerSearch = "";
      state.customerTypeFilter = "all";
      state.screen = "create";
      render();
    }

    function editInvoice(id) {
      const invoice = db.invoices.find(item => item.id === id);
      if (!invoice) return;
      openEditInvoiceConfirm(id);
    }

    function openEditInvoiceConfirm(id) {
      modalContext = { type: "edit-confirm", id };
      document.getElementById("modalRoot").innerHTML = `
        <div class="modal-backdrop">
          <div class="modal stack" role="dialog" aria-modal="true">
            <div class="section-head">
              <h2>${t("editConfirmedInvoiceTitle")}</h2>
              <button type="button" onclick="closeModal()">${t("close")}</button>
            </div>
            <div class="list-card">
              <div class="name">${t("editConfirmedInvoiceMessage")}</div>
            </div>
            <div class="actions">
              <button type="button" onclick="closeModal()">${t("cancel")}</button>
              <button class="primary" type="button" onclick="continueEditInvoice()">${t("continueEditing")}</button>
            </div>
          </div>
        </div>
      `;
    }

    function continueEditInvoice() {
      if (!modalContext || modalContext.type !== "edit-confirm") return;
      const id = modalContext.id;
      closeModal();
      openInvoiceForEdit(id);
    }

    function openInvoiceForEdit(id) {
      const invoice = db.invoices.find(item => item.id === id);
      if (!invoice) return;
      state.draft = {
        editingId: invoice.id,
        savedId: invoice.id,
        numberIndex: null,
        numberCommitted: true,
        number: invoice.number,
        date: invoice.date || today(),
        deliveryDate: invoice.deliveryDate || invoice.date || today(),
        dueDate: invoice.dueDate || invoice.deliveryDate || invoice.date || today(),
        reference: invoice.reference || "",
        paymentStatus: invoice.paymentStatus || "unpaid",
        paymentMethod: invoice.paymentMethod || "",
        paidAmount: numberValue(invoice.paidAmount, 0),
        invoiceType: invoice.invoiceType || customerInvoiceType(invoice.customer?.type),
        invoiceDiscountPercent: numberValue(invoice.invoiceDiscountPercent, invoice.totals?.invoiceDiscountPercent || 0),
        customerId: invoice.customerId || "",
        customer: invoice.customer || null,
        lines: structuredClone(invoice.lines || []),
        timestamp: invoice.timestamp || localInvoiceTimestamp(invoice.date || today())
      };
      state.step = 1;
      state.customerSearch = "";
      state.screen = "create";
      render();
    }

    function renderCreateInvoice() {
      if (!state.draft) startNewInvoice();
      const hasCustomer = Boolean(currentCustomer());
      const hasItems = Boolean(state.draft?.lines?.length);
      const steps = [
        { step: 1, label: t("customer"), enabled: true },
        { step: 2, label: t("details"), enabled: hasCustomer },
        { step: 3, label: t("items"), enabled: hasCustomer },
        { step: 4, label: t("preview"), enabled: hasCustomer && hasItems }
      ];
      return `
        <div class="stepper">
          ${steps.map(item => `
            <button type="button" class="step ${state.step === item.step ? "active" : ""} ${item.enabled ? "" : "disabled"}" ${item.enabled ? `onclick="goToInvoiceStep(${item.step})"` : "disabled"}>${item.step}. ${item.label}</button>
          `).join("")}
        </div>
        ${state.step === 1 ? renderCustomerStep() : ""}
        ${state.step === 2 ? renderDetailsStep() : ""}
        ${state.step === 3 ? renderItemsStep() : ""}
        ${state.step === 4 ? renderPreviewStep() : ""}
      `;
    }

    function goToInvoiceStep(step) {
      if (!state.draft) return;
      const hasCustomer = Boolean(currentCustomer());
      const hasItems = Boolean(state.draft.lines?.length);
      if (step === 1 || (step === 2 && hasCustomer) || (step === 3 && hasCustomer) || (step === 4 && hasCustomer && hasItems)) {
        state.step = step;
        render();
      }
    }

    function renderCustomerStep() {
      state.customerTypeFilter = state.customerTypeFilter || "all";
      const activeFilter = ["company", "individual"].includes(state.customerTypeFilter) ? state.customerTypeFilter : "all";
      const terms = state.customerSearch.trim().toLowerCase().split(/\s+/).filter(Boolean);
      const customers = db.customers.filter(customer => {
        if (activeFilter !== "all" && customer.type !== activeFilter) return false;
        const haystack = customerSearchText(customer);
        return terms.every(term => haystack.includes(term));
      });
      return `
        <div class="grid">
          <div class="card stack customer-picker-card">
            <div class="section-head">
              <h2>${t("chooseCustomer")}</h2>
            </div>
            <input data-focus-id="customer-search" placeholder="${t("searchCustomers")}" value="${escapeHtml(state.customerSearch)}" oninput="state.customerSearch=this.value; renderKeepingFocus()" autocomplete="off">
            <div class="customer-filter-tags" role="group" aria-label="${t("customerType")}">
              ${["all", "company", "individual"].map(type => `
                <button type="button" class="status-tag ${activeFilter === type ? "active" : ""}" onclick="setCustomerTypeFilter('${type}')">${type === "all" ? t("all") : customerTypeLabel(type)}</button>
              `).join("")}
            </div>
            <div class="customer-picker-list">
              <button type="button" class="customer-picker-item customer-create-item" onclick="openCustomerModal(null, true, state.customerSearch)">
                <div class="name">+ ${t("createNewCustomer")}</div>
                <div class="small muted">${t("createCustomer")}</div>
              </button>
              ${customers.length ? customers.map(customer => renderCustomerPickerItem(customer)).join("") : `<div class="empty">${t("noCustomersFound")}</div>`}
            </div>
          </div>
        </div>
      `;
    }

    function setCustomerTypeFilter(filter) {
      state.customerTypeFilter = ["company", "individual"].includes(filter) ? filter : "all";
      render();
    }

    function renderCustomerPickerItem(customer) {
      const isSelected = state.draft?.customerId === customer.id;
      const identity = customerTableIdentityValue(customer) || customerIdentityValue(customer) || t("noVatNumber");
      const mobile = customerMobile(customer);
      return `
        <button type="button" class="customer-picker-item ${isSelected ? "selected" : ""}" onclick="selectCustomerAndShowMiniDetails('${escapeJsString(customer.id)}')">
          <div class="list-main">
            <div>
              <div class="name">${escapeHtml(customer.name || t("notAvailable"))}</div>
              <div class="customer-picker-meta">
                <div class="small muted">${escapeHtml(identity)}</div>
                ${mobile ? `<div class="small muted">${escapeHtml(mobile)}</div>` : ""}
                ${customer.city ? `<div class="small muted">${escapeHtml(customer.city)}</div>` : ""}
              </div>
            </div>
            <span class="pill customer-picker-type">${customerTypeLabel(customer.type)}</span>
          </div>
        </button>
      `;
    }

    function currentCustomer() {
      if (!state.draft) return null;
      return db.customers.find(customer => customer.id === state.draft.customerId) || state.draft.customer || null;
    }

    function setSelectedCustomer(id) {
      const customer = db.customers.find(item => item.id === id);
      if (!customer || !state.draft) return null;
      state.draft.customerId = customer.id;
      state.draft.customer = structuredClone(customer);
      state.draft.invoiceType = customerInvoiceType(customer.type);
      state.customerSearch = customer.name || "";
      return customer;
    }

    function selectCustomer(id) {
      const customer = setSelectedCustomer(id);
      if (!customer) return;
      render();
    }

    function selectCustomerAndShowMiniDetails(id) {
      const customer = setSelectedCustomer(id);
      if (!customer) return;
      render();
      openSelectedCustomerMiniDetails(id);
    }

    function clearSelectedCustomer() {
      if (!state.draft) return;
      state.draft.customerId = "";
      state.draft.customer = null;
      state.draft.invoiceType = "tax";
      state.customerSearch = "";
      render();
    }

    function renderCustomerMiniField(label, value, wide = false) {
      return `
        <div class="selected-customer-field ${wide ? "wide" : ""}">
          <span class="meta-label">${escapeHtml(label)}</span>
          <span class="meta-value">${escapeHtml(displayValue(value))}</span>
        </div>
      `;
    }

    function openSelectedCustomerMiniDetails(id) {
      const customer = db.customers.find(item => item.id === id) || currentCustomer();
      if (!customer) return;
      const address = compactAddress(customer) || customer.city || customer.address || "";
      modalContext = { type: "selected-customer-mini", id };
      document.getElementById("modalRoot").innerHTML = `
        <div class="modal-backdrop profile-backdrop" onclick="closeModal()">
          <div class="customer-mini-card" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
            <div class="profile-top">
              <div class="profile-heading">
                <h2>${t("customerMiniDetails")}</h2>
                <div class="small muted">${escapeHtml(customer.name || t("notAvailable"))}</div>
              </div>
              <button class="profile-close" type="button" aria-label="${t("close")}" onclick="closeModal()">X</button>

            <div class="customer-mini-grid">
              ${renderCustomerMiniField(t("customerName"), customer.name)}
              ${renderCustomerMiniField(t("customerType"), customerTypeLabel(customer.type))}
              ${renderCustomerMiniField(t("invoiceType"), customerInvoiceTypeLabel(customer))}
              ${renderCustomerMiniField(t("vatOrIdNumber"), customerTableIdentityValue(customer) || customerIdentityValue(customer))}
              ${renderCustomerMiniField(t("phoneOrMobile"), customerMobile(customer))}
              ${renderCustomerMiniField(t("city"), customer.city)}
              ${renderCustomerMiniField(t("address"), address, true)}
            </div>
            <div class="customer-modal-actions">
              <button type="button" onclick="closeModal()">${t("changeCustomer")}</button>
              <button class="primary" type="button" onclick="confirmSelectedCustomerAndGoNext()">${t("next")}</button>
            </div>
          </div>
        </div>
      `;
    }

    function confirmSelectedCustomerAndGoNext() {
      closeModal();
      state.step = 2;
      render();
    }

    function renderDetailsStep() {
      const draft = state.draft;
      return `
        <div class="grid">
          <div class="card stack">
            <h2>${t("invoiceDetails")}</h2>
            <label>${t("invoiceNumberAuto")}
              <input value="${escapeHtml(draft.number)}" readonly>
            </label>
            <label>${t("reference")}
              <input value="${escapeHtml(draft.reference)}" oninput="updateDraft('reference', this.value)" placeholder="${t("referencePlaceholder")}">
            </label>
            <div class="split">
              <label>${t("invoiceDate")}
                <input type="date" value="${escapeHtml(draft.date)}" onchange="updateDraft('date', this.value)">
              </label>
              <label>${t("deliveryDate")}
                <input type="date" value="${escapeHtml(draft.deliveryDate)}" onchange="updateDraft('deliveryDate', this.value)">
              </label>
            </div>
            <label>${t("dueDate")}
              <input type="date" value="${escapeHtml(draft.dueDate || "")}" onchange="updateDraft('dueDate', this.value); render()">
            </label>
          </div>
          <div class="actions">
            <button onclick="state.step=1; render()">${t("previous")}</button>
            <button class="primary" onclick="state.step=3; render()">${t("next")}</button>
          </div>
        </div>
      `;
    }

    function renderPaymentStatusSection(draft, totals) {
      const payment = paymentState(draft, totals.grand);
      return `
        <div class="stack payment-status-card">
          <label>${t("paymentStatus")}</label>
          <div class="tag-group">
            ${["unpaid", "paid", "partial"].map(status => `
              <button type="button" class="status-tag status-${status} ${payment.baseStatus === status ? "active" : ""}" onclick="selectPaymentStatus('${status}')">${paymentStatusLabel(status)}</button>
            `).join("")}
          </div>
          ${payment.displayStatus === "overdue" ? `<span class="pill status-overdue">${t("automaticOverdue")}</span>` : ""}
          <div class="payment-summary">
            <div class="meta-cell"><span class="meta-label">${t("paymentMethod")}</span><span class="meta-value">${escapeHtml(paymentMethodLabel(payment.paymentMethod))}</span></div>
            <div class="meta-cell"><span class="meta-label">${t("paidAmount")}</span><span class="meta-value">${money(payment.paidAmount)}</span></div>
          </div>
        </div>
      `;
    }

    function updateDraft(field, value) {
      if (!state.draft) return;
      state.draft[field] = value;
      if (field === "date") {
        state.draft.timestamp = localInvoiceTimestamp(value || today());
      }
    }

    function selectPaymentStatus(status) {
      if (!state.draft) return;
      if (status === "unpaid") {
        state.draft.paymentStatus = "unpaid";
        state.draft.paymentMethod = "";
        state.draft.paidAmount = 0;
        render();
        return;
      }
      openPaymentModal(status);
    }

    function openPaymentModal(status) {
      if (!state.draft) return;
      const totals = calculateTotals(state.draft.lines, state.draft.invoiceDiscountPercent);
      const selectedMethod = state.draft.paymentMethod || "cash";
      const paidAmount = status === "partial" ? Math.max(0, numberValue(state.draft.paidAmount, 0)) : totals.grand;
      modalContext = { type: "payment", status };
      document.getElementById("modalRoot").innerHTML = `
        <div class="modal-backdrop profile-backdrop" onclick="closeModal()">
          <form class="payment-modal stack" role="dialog" aria-modal="true" onsubmit="savePaymentModal(event)" onclick="event.stopPropagation()">
            <div class="section-head">
              <h2>${t("paymentDetails")}</h2>
              <button type="button" onclick="closeModal()">${t("close")}</button>
            </div>
            <input type="hidden" name="paymentMethod" value="${escapeHtml(selectedMethod)}">
            <div class="payment-summary">
              <div class="meta-cell"><span class="meta-label">${t("paymentStatus")}</span><span class="meta-value">${paymentStatusLabel(status)}</span></div>
              <div class="meta-cell"><span class="meta-label">${t("totalDue")}</span><span class="meta-value">${money(totals.grand)}</span></div>
            </div>
            ${status === "partial" ? `
              <label>${t("paidAmount")}
                <input type="number" min="0" step="0.01" name="paidAmount" value="${escapeHtml(paidAmount || "")}" inputmode="decimal" autofocus>
              </label>
            ` : ""}
            <div class="stack">
              <label>${t("paymentMethod")}</label>
              <div class="tag-group payment-method-tags">
                ${["cash", "span", "transfer"].map(method => `
                  <button type="button" class="status-tag ${selectedMethod === method ? "active" : ""}" data-payment-method-option="${method}" onclick="setPaymentMethod(this, '${method}')">${t(method)}</button>
                `).join("")}
              </div>
            </div>
            <div class="customer-modal-actions">
              <button type="button" onclick="closeModal()">${t("cancel")}</button>
              <button class="primary" type="submit">${t("savePayment")}</button>
            </div>
          </form>
        </div>
      `;
    }

    function setPaymentMethod(button, method) {
      const form = button.closest("form");
      if (!form) return;
      form.elements.paymentMethod.value = method;
      form.querySelectorAll("[data-payment-method-option]").forEach(option => {
        option.classList.toggle("active", option.dataset.paymentMethodOption === method);
      });
    }

    function savePaymentModal(event) {
      event.preventDefault();
      if (!state.draft || modalContext?.type !== "payment") return;
      const data = new FormData(event.target);
      const status = modalContext.status === "partial" ? "partial" : "paid";
      const totals = calculateTotals(state.draft.lines, state.draft.invoiceDiscountPercent);
      const method = data.get("paymentMethod") || "cash";
      const amount = status === "paid" ? totals.grand : Math.max(0, numberValue(data.get("paidAmount"), 0));
      const next = paymentStateForSave({
        ...state.draft,
        paymentStatus: status,
        paymentMethod: method,
        paidAmount: amount
      }, totals.grand);
      state.draft.paymentStatus = next.baseStatus;
      state.draft.paymentMethod = next.paymentMethod;
      state.draft.paidAmount = next.paidAmount;
      closeModal();
      render();
    }

    function openAddPaymentModal(invoiceId) {
      const invoice = db.invoices.find(item => item.id === invoiceId);
      if (!invoice) return;
      const totals = totalsForInvoice(invoice);
      const payment = paymentState(invoice, totals.grand);
      const currentPaid = Math.min(Math.max(0, totals.grand), payment.paidAmount);
      const outstanding = Math.max(0, totals.grand - currentPaid);
      const selectedMethod = payment.paymentMethod || "cash";
      const customer = invoice.customer || {};
      modalContext = { type: "invoice-payment", id: invoiceId };
      document.getElementById("modalRoot").innerHTML = `
        <div class="modal-backdrop profile-backdrop" onclick="closeModal()">
          <form class="payment-modal stack" role="dialog" aria-modal="true" onsubmit="saveInvoicePayment(event)" onclick="event.stopPropagation()">
            <div class="section-head">
              <h2>${t("addPayment")}</h2>

    function paymentPayloadFromAddPaymentForm(form, invoice) {
      const data = new FormData(form);
      const totals = totalsForInvoice(invoice);
      const current = paymentState(invoice, totals.grand);
      const grandTotal = Math.max(0, totals.grand);
      const currentPaidAmount = Math.min(grandTotal, Math.max(0, current.paidAmount));
      const outstandingBefore = Math.max(0, grandTotal - currentPaidAmount);
      const rawPaymentAmount = Math.max(0, numberValue(data.get("paymentAmount"), 0));
      const paymentAmount = Math.min(rawPaymentAmount, outstandingBefore);
      const totalPaidAmount = Math.min(grandTotal, currentPaidAmount + paymentAmount);
      const outstandingAmount = Math.max(0, grandTotal - totalPaidAmount);
      return {
        paymentAmount,
        paymentMethod: data.get("paymentMethod") || current.paymentMethod || "cash",
        paymentDate: data.get("paymentDate") || today(),
        note: String(data.get("paymentNote") || "").trim(),
        currentPaidAmount,
        outstandingBefore,
        grandTotal,
        totalPaidAmount,
        outstandingAmount
      };
    }

    function saveInvoicePayment(event) {
      event.preventDefault();
      if (modalContext?.type !== "invoice-payment") return;
      const invoice = db.invoices.find(item => item.id === modalContext.id);
      if (!invoice) return;
      const paymentData = paymentPayloadFromAddPaymentForm(event.target, invoice);
      const existingPayments = storedPayments(invoice);
      const payments = existingPayments.length
        ? existingPayments
        : (paymentData.currentPaidAmount > 0 ? [{
          id: uid("payment"),
          receiptNo: `${invoice.number || "INV"}-R001`,
          date: invoice.paymentDate || invoice.date || today(),
          amount: paymentData.currentPaidAmount,
          method: invoice.paymentMethod || paymentData.paymentMethod || "",
          note: ""
        }] : []);
      if (paymentData.paymentAmount > 0) {
        const nextReceiptNo = `${invoice.number || "INV"}-R${String(payments.length + 1).padStart(3, "0")}`;
        payments.push({
          id: uid("payment"),
          receiptNo: nextReceiptNo,
          date: paymentData.paymentDate,
          amount: paymentData.paymentAmount,
          method: paymentData.paymentMethod,
          note: paymentData.note
        });
      }
      const totalPaidAmount = Math.min(paymentData.grandTotal, payments.reduce((sum, payment) => sum + Math.max(0, numberValue(payment.amount, 0)), 0));
      let status = "unpaid";
      if (paymentData.grandTotal > 0 && totalPaidAmount >= paymentData.grandTotal) {
        status = "paid";
      } else if (totalPaidAmount > 0) {
        status = "partial";
      }
      invoice.payments = payments;
      invoice.paymentStatus = status;
      invoice.paidAmount = status === "paid" ? paymentData.grandTotal : totalPaidAmount;
      invoice.paymentMethod = status === "unpaid" ? "" : paymentData.paymentMethod;
      saveDb();
      closeModal();
      render();
    }

    function recentUsedItems(limit = 5) {
      const seen = new Set();
      const recent = [];
      const invoices = [...db.invoices].sort((a, b) => String(b.createdAt || b.date || "").localeCompare(String(a.createdAt || a.date || "")));
      invoices.forEach(invoice => {
        [...(invoice.lines || [])].reverse().forEach(line => {
          const name = String(line.name || "").trim();
          if (!name) return;
          const key = line.itemId ? `item:${line.itemId}` : `name:${name.toLowerCase()}`;
          if (seen.has(key) || recent.length >= limit) return;
          seen.add(key);
          recent.push({
            itemId: line.itemId || "",
            name,
            description: line.description || "",
            price: numberValue(line.price, 0),
            vatType: line.vatType || "Sales 15%",
            vatRate: numberValue(line.vatRate, 15)
          });
        });
      });
      return recent.slice(0, limit);
    }

    function calculateLine(line) {
      const qty = Math.max(0, numberValue(line.qty, 0));
      const price = Math.max(0, numberValue(line.price, 0));
      const rate = Math.max(0, numberValue(line.vatRate, 0));
      const discountPercent = Math.min(100, Math.max(0, numberValue(line.discountPercent, 0)));
      const subtotal = qty * price;
      const discount = subtotal * discountPercent / 100;
      const net = Math.max(0, subtotal - discount);
      const vat = net * rate / 100;
      return {
        subtotal,
        discountPercent,
        discount,
        net,
        vat,
        total: net + vat
      };
    }

    function calculateTotals(lines, invoiceDiscountPercent = 0) {
      const totals = (lines || []).reduce((total, line) => {
        const calc = calculateLine(line);
        total.subtotalBeforeDisc += calc.subtotal;
        total.itemDiscounts += calc.discount;
        total.subtotalAfterDisc += calc.net;
        total.lineVat += calc.vat;
        total.lineGrand += calc.total;
        total.vat += calc.vat;
        total.grand += calc.total;
        return total;
      }, {
        subtotalBeforeDisc: 0,
        itemDiscounts: 0,
        subtotalAfterDisc: 0,
        invoiceDiscountPercent: Math.min(100, Math.max(0, numberValue(invoiceDiscountPercent, 0))),
        invoiceDiscountAmount: 0,
        subtotalBeforeVat: 0,
        lineVat: 0,
        lineGrand: 0,
        subtotal: 0,
        vat: 0,
        grand: 0
      });
      totals.invoiceDiscountAmount = totals.subtotalAfterDisc * totals.invoiceDiscountPercent / 100;
      totals.subtotalBeforeVat = Math.max(0, totals.subtotalAfterDisc - totals.invoiceDiscountAmount);
      const discountFactor = totals.subtotalAfterDisc > 0 ? totals.subtotalBeforeVat / totals.subtotalAfterDisc : 1;
      totals.vat = totals.lineVat * discountFactor;
      totals.grand = totals.subtotalBeforeVat + totals.vat;
      totals.subtotal = totals.subtotalBeforeVat;
      return totals;
    }

    function totalsForInvoice(invoice) {

    function saveInvoiceFromDraft() {
      const draft = state.draft;
      const customer = currentCustomer();
      const totals = calculateTotals(draft.lines, draft.invoiceDiscountPercent);
      const seller = sellerSnapshot();
      const payment = paymentStateForSave(draft, totals.grand);
      draft.paymentStatus = payment.baseStatus;
      draft.paymentMethod = payment.paymentMethod;
      draft.paidAmount = payment.paidAmount;
      const invoice = {
        id: draft.savedId || draft.editingId || uid("invoice"),
        number: draft.number,
        date: draft.date,
        deliveryDate: draft.deliveryDate,
        dueDate: draft.dueDate,
        reference: draft.reference,
        paymentStatus: payment.paymentStatus,
        paymentMethod: payment.paymentMethod,
        paidAmount: payment.paidAmount,
        invoiceType: draft.invoiceType || (customer ? customerInvoiceType(customer.type) : "tax"),
        invoiceDiscountPercent: totals.invoiceDiscountPercent,
        customerId: draft.customerId,
        customer: customer ? structuredClone(customer) : null,
        seller,
        lines: structuredClone(draft.lines).map(line => ({ ...line, ...calculateLine(line) })),
        totals,
        timestamp: draft.timestamp || localInvoiceTimestamp(draft.date || today()),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      invoice.qrData = createZatcaQrBase64(invoice);

      const existingIndex = db.invoices.findIndex(item => item.id === invoice.id);
      if (existingIndex >= 0) {
        invoice.createdAt = db.invoices[existingIndex].createdAt || invoice.createdAt;
        db.invoices[existingIndex] = invoice;
      } else {
        db.invoices.unshift(invoice);
        if (!draft.numberCommitted) {
          const next = Math.max(numberValue(db.settings.nextInvoiceNumber, 1), numberValue(draft.numberIndex, 1) + 1);
          db.settings.nextInvoiceNumber = next;
          draft.numberCommitted = true;
        }
      }
      draft.savedId = invoice.id;
      saveDb();
      return invoice;
    }

    function paymentRecordPayload(invoice, paymentIndex) {
      const total = totalsForInvoice(invoice).grand;
      const payments = getInvoicePayments(invoice, total);
      const record = payments[paymentIndex];
      if (!record) return null;
      const totalPaidAmount = Math.min(total, payments
        .slice(0, paymentIndex + 1)
        .reduce((sum, payment) => sum + Math.max(0, numberValue(payment.amount, 0)), 0));
      return {
        receiptNo: paymentReceiptNo(invoice, record, paymentIndex),
        paymentAmount: Math.max(0, numberValue(record.amount, 0)),
        paymentMethod: record.method || "",
        paymentDate: record.date || today(),
        note: record.note || "",
        grandTotal: total,
        totalPaidAmount,
        outstandingAmount: Math.max(0, total - totalPaidAmount)
      };
    }

    function renderInvoiceSortHeader(key, label) {
      const active = state.invoiceSort?.key === key;
      const indicator = active ? `<span class="sort-indicator">${state.invoiceSort.dir === "asc" ? "↑" : "↓"}</span>` : "";
      return `<button type="button" class="sort-header-button" onclick="setInvoiceSort('${key}')"><span>${escapeHtml(label)}</span>${indicator}</button>`;
    }

    function setInvoiceSort(key) {
      const current = state.invoiceSort || { key: "date", dir: "desc" };
      state.invoiceSort = current.key === key
        ? { key, dir: current.dir === "asc" ? "desc" : "asc" }
        : { key, dir: "asc" };
      render();
    }

    function sortInvoices(invoices) {
      const sort = state.invoiceSort || { key: "date", dir: "desc" };
      const direction = sort.dir === "asc" ? 1 : -1;
      return [...invoices].sort((a, b) => {
        const aValue = invoiceSortValue(a, sort.key);
        const bValue = invoiceSortValue(b, sort.key);
        let result;
        if (sort.key === "total") result = aValue - bValue;
        else result = String(aValue).localeCompare(String(bValue), undefined, { numeric: true, sensitivity: "base" });
        if (result === 0) {
          result = String(a.createdAt || a.date || "").localeCompare(String(b.createdAt || b.date || ""), undefined, { numeric: true, sensitivity: "base" });
        }
        return result * direction;
      });
    }

    function invoiceSortValue(invoice, key) {
      if (key === "number") return invoice.number || "";
      if (key === "customer") return invoice.customer?.name || "";
      if (key === "total") return totalsForInvoice(invoice).grand;
      return invoice.date || "";
    }

      const form = event.target.closest("form");
      const nextSettings = form ? settingsFromForm(form) : { ...db.settings };
      const reader = new FileReader();
      reader.onload = () => {
        db.settings = { ...nextSettings, logoDataUrl: String(reader.result || "") };
        saveDb();
        render();
      };
      reader.readAsDataURL(file);
    }

    function applyCustomerTypePanel(form, type) {
      if (!form) return;
      form.elements.type.value = type;
      form.querySelectorAll("[data-customer-type-option]").forEach(option => {
        option.classList.toggle("active", option.dataset.customerTypeOption === type);
      });
      form.querySelectorAll("[data-customer-type-panel]").forEach(panel => {
        const isActive = panel.dataset.customerTypePanel === type;
        panel.hidden = !isActive;
        panel.querySelectorAll("input, select, textarea").forEach(control => {
          control.disabled = !isActive;
          control.required = isActive && control.dataset.requiredFor === type;
        });
      });
      const invoiceType = form.querySelector("[data-customer-invoice-type]");
      if (invoiceType) invoiceType.textContent = type === "individual" ? t("simplifiedTaxInvoice") : t("taxInvoice");
    }

    function setCustomerModalType(button, type) {
      applyCustomerTypePanel(button.closest("form"), type);

    function saveCustomerModal(event) {
      event.preventDefault();
      const data = new FormData(event.target);
      const type = data.get("type") || "company";
      const mobile = String(data.get("mobile") || "").trim();
      const customer = {
        id: modalContext.id || uid("customer"),
        type,
        name: String(data.get("name") || "").trim(),
        vat: String(data.get("vat") || "").trim(),
        nationalId: String(data.get("nationalId") || "").trim(),
        crNumber: String(data.get("crNumber") || "").trim(),
        address: String(data.get("address") || "").trim(),
        building: String(data.get("building") || "").trim(),
        street: String(data.get("street") || "").trim(),
        district: String(data.get("district") || "").trim(),
        city: String(data.get("city") || "").trim(),
        postalCode: String(data.get("postalCode") || "").trim(),
        country: "Saudi Arabia",
        contactPerson: String(data.get("contactPerson") || "").trim(),
        mobile,
        phone: mobile,
        email: String(data.get("email") || "").trim(),
        invoiceType: customerInvoiceType(type)
      };
      const index = db.customers.findIndex(item => item.id === customer.id);
      if (index >= 0) db.customers[index] = customer;
      else db.customers.unshift(customer);
      const shouldShowSelectedMini = Boolean(modalContext.selectAfterSave && state.draft);
      if (shouldShowSelectedMini) {
        state.draft.customerId = customer.id;
        state.draft.customer = structuredClone(customer);
        state.draft.invoiceType = customer.invoiceType;
        state.customerSearch = customer.name;
      }
      saveDb();
      closeModal();
      render();
      if (shouldShowSelectedMini) openSelectedCustomerMiniDetails(customer.id);
    }

    function saveItemModal(event) {
      event.preventDefault();
      const data = new FormData(event.target);
      const item = {
        id: modalContext.id || uid("item"),
        name: data.get("name").trim(),
        description: data.get("description").trim(),
        price: numberValue(data.get("price"), 0),
        vatType: data.get("vatType"),
        vatRate: numberValue(data.get("vatRate"), 15)
      };
      const index = db.items.findIndex(entry => entry.id === item.id);
      if (index >= 0) db.items[index] = item;
      else db.items.unshift(item);
      if (modalContext.addToInvoice && state.draft) {
        state.draft.lines.push({
          id: uid("line"),
          itemId: item.id,
          name: item.name,
          description: item.description,
          qty: 1,
          price: item.price,
          discountPercent: 0,
          vatType: item.vatType,
          vatRate: item.vatRate
        });
      }
      saveDb();
      closeModal();
      render();
    }

    function localInvoiceTimestamp(dateValue) {
      const now = new Date();
      const datePart = dateValue || today();
      const timePart = [
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0")
      ].join(":");
      const offsetMinutes = -now.getTimezoneOffset();
      const sign = offsetMinutes >= 0 ? "+" : "-";
      const absolute = Math.abs(offsetMinutes);
      const offset = sign + String(Math.floor(absolute / 60)).padStart(2, "0") + ":" + String(absolute % 60).padStart(2, "0");
      return datePart + "T" + timePart + offset;
    }

    function createZatcaQrBase64(invoice) {
      const seller = invoice.seller || sellerSnapshot();
      const totals = totalsForInvoice(invoice);
      const values = [
        seller.sellerName || "",
        seller.vatNumber || "",
        invoice.timestamp || localInvoiceTimestamp(invoice.date || today()),
        totals.grand.toFixed(2),
        totals.vat.toFixed(2)
      ];
      const encoder = new TextEncoder();
      const bytes = [];
      values.forEach((value, index) => {
        const valueBytes = Array.from(encoder.encode(String(value)));
        bytes.push(index + 1, valueBytes.length, ...valueBytes);
      });
      let binary = "";
      bytes.forEach(byte => binary += String.fromCharCode(byte));
      return btoa(binary);
    }

    function openInvoicePrintFrame(html, title) {
      const iframe = document.createElement("iframe");
      iframe.title = title;
      iframe.style.cssText = "position:fixed;left:-10000px;top:0;width:210mm;height:297mm;border:0;opacity:0;";
      document.body.appendChild(iframe);
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(`<!doctype html>
        <html>
          <head>
            <meta charset="utf-8">
            <title>${escapeHtml(title)}</title>
            <style>${printWindowStyles()}</style>
          </head>
          <body>${html}</body>
        </html>`);
      doc.close();
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => {
          iframe.remove();
          document.getElementById("printArea").innerHTML = "";
        }, 1000);
      }, 150);
    }

    function sellerForPrint(invoice) {
      const current = sellerSnapshot();
      const saved = invoice?.seller || {};
      const bankFields = ["bankName", "accountName", "iban", "accountNumber"];
      const bankDetails = Object.fromEntries(
        bankFields.map(field => [field, String(saved[field] || "").trim() ? saved[field] : current[field] || ""])
      );
      const hasCurrentProfile = [
        current.sellerName,
        current.vatNumber,
        current.crNumber,
        current.address,
        current.phone,
        current.email,
        current.logoDataUrl

    const QR_NUM_ERROR_CORRECTION_BLOCKS = [

    ];

    function qrSvg(text) {
      const qr = makeQr(text || "");
      const quiet = 4;
      const size = qr.size + quiet * 2;
      let path = "";
      for (let y = 0; y < qr.size; y++) {
        for (let x = 0; x < qr.size; x++) {
          if (qr.modules[y][x]) path += "M" + (x + quiet) + "," + (y + quiet) + "h1v1h-1z";
        }
      }
      return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="ZATCA QR code" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect width="${size}" height="${size}" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
    }

    function makeQr(text) {
      const dataBytes = Array.from(new TextEncoder().encode(text));
      const ecl = 1;
      let version = 1;
      for (; version <= 40; version++) {
        const dataCapacity = getNumDataCodewords(version, ecl) * 8;
        const countBits = version <= 9 ? 8 : 16;
        if (4 + countBits + dataBytes.length * 8 <= dataCapacity) break;
      }
      if (version > 40) {
        version = 40;
        dataBytes.length = Math.min(dataBytes.length, getNumDataCodewords(version, ecl) - 3);
      }
      const dataCodewords = encodeQrData(dataBytes, version, ecl);
      const allCodewords = addEccAndInterleave(dataCodewords, version, ecl);
      const size = version * 4 + 17;
      const modules = Array.from({ length: size }, () => Array(size).fill(false));
      const isFunction = Array.from({ length: size }, () => Array(size).fill(false));
      drawFunctionPatterns(modules, isFunction, version, ecl, 0);
      drawCodewords(modules, isFunction, allCodewords);
      applyMask(modules, isFunction, 0);
      drawFormatBits(modules, isFunction, ecl, 0);
      if (version >= 7) drawVersion(modules, isFunction, version);
      return { size, modules };
    }

    function encodeQrData(dataBytes, version, ecl) {
      const bitData = [];
      appendBits(bitData, 4, 4);
      appendBits(bitData, dataBytes.length, version <= 9 ? 8 : 16);
      dataBytes.forEach(byte => appendBits(bitData, byte, 8));
      const capacityBits = getNumDataCodewords(version, ecl) * 8;
      appendBits(bitData, 0, Math.min(4, capacityBits - bitData.length));
      while (bitData.length % 8 !== 0) bitData.push(0);
      const result = [];
      for (let i = 0; i < bitData.length; i += 8) {
        let value = 0;
        for (let j = 0; j < 8; j++) value = (value << 1) | bitData[i + j];
        result.push(value);
      }
      for (let pad = 0; result.length < getNumDataCodewords(version, ecl); pad ^= 1) {
        result.push(pad ? 0x11 : 0xEC);
      }
      return result;
    }

    function appendBits(target, value, length) {
      for (let i = length - 1; i >= 0; i--) target.push((value >>> i) & 1);
    }

    function getNumRawDataModules(version) {
      let result = (16 * version + 128) * version + 64;
      if (version >= 2) {
        const numAlign = Math.floor(version / 7) + 2;
        result -= (25 * numAlign - 10) * numAlign - 55;
        if (version >= 7) result -= 36;
      }
      return result;
    }

    function getNumDataCodewords(version, ecl) {
      return Math.floor(getNumRawDataModules(version) / 8)
        - QR_ECC_CODEWORDS_PER_BLOCK[ecl][version] * QR_NUM_ERROR_CORRECTION_BLOCKS[ecl][version];
    }

    function addEccAndInterleave(data, version, ecl) {
      const numBlocks = QR_NUM_ERROR_CORRECTION_BLOCKS[ecl][version];
      const blockEccLen = QR_ECC_CODEWORDS_PER_BLOCK[ecl][version];
      const rawCodewords = Math.floor(getNumRawDataModules(version) / 8);
      const numShortBlocks = numBlocks - rawCodewords % numBlocks;
      const shortBlockLen = Math.floor(rawCodewords / numBlocks);
      const rsDivisor = reedSolomonComputeDivisor(blockEccLen);
      const blocks = [];
      let k = 0;
      for (let i = 0; i < numBlocks; i++) {
        const dataLength = shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1);
        const dataBlock = data.slice(k, k + dataLength);
        k += dataLength;
        const ecc = reedSolomonComputeRemainder(dataBlock, rsDivisor);
        if (i < numShortBlocks) dataBlock.push(0);
        blocks.push(dataBlock.concat(ecc));
      }
      const result = [];
      for (let i = 0; i < blocks[0].length; i++) {
        blocks.forEach((block, blockIndex) => {
          if (i !== shortBlockLen - blockEccLen || blockIndex >= numShortBlocks) {
            if (i < block.length) result.push(block[i]);
          }
        });
      }
      return result;
    }

    function reedSolomonComputeDivisor(degree) {
      const result = Array(degree).fill(0);
      result[degree - 1] = 1;
      let root = 1;
      for (let i = 0; i < degree; i++) {
        for (let j = 0; j < degree; j++) {
          result[j] = reedSolomonMultiply(result[j], root);
          if (j + 1 < degree) result[j] ^= result[j + 1];
        }
        root = reedSolomonMultiply(root, 0x02);
      }
      return result;
    }

    function reedSolomonComputeRemainder(data, divisor) {
      const result = Array(divisor.length).fill(0);
      data.forEach(byte => {
        const factor = byte ^ result.shift();
        result.push(0);
        divisor.forEach((coefficient, index) => {
          result[index] ^= reedSolomonMultiply(coefficient, factor);
        });
      });
      return result;
    }

    function reedSolomonMultiply(x, y) {
      let z = 0;
      for (let i = 7; i >= 0; i--) {
        z = (z << 1) ^ ((z >>> 7) * 0x11D);
        z ^= ((y >>> i) & 1) * x;
      }
      return z & 0xFF;
    }

    function drawFunctionPatterns(modules, isFunction, version, ecl, mask) {
      const size = modules.length;
      drawFinder(modules, isFunction, 3, 3);
      drawFinder(modules, isFunction, size - 4, 3);
      drawFinder(modules, isFunction, 3, size - 4);
      const align = getAlignmentPositions(version);
      align.forEach(x => align.forEach(y => {
        if (!isFunction[y][x]) drawAlignment(modules, isFunction, x, y);
      }));
      for (let i = 0; i < size; i++) {
        if (!isFunction[6][i]) setFunction(modules, isFunction, i, 6, i % 2 === 0);
        if (!isFunction[i][6]) setFunction(modules, isFunction, 6, i, i % 2 === 0);
      }
      drawFormatBits(modules, isFunction, ecl, mask);
      if (version >= 7) drawVersion(modules, isFunction, version);
    }

    function setFunction(modules, isFunction, x, y, dark) {
      modules[y][x] = dark;
      isFunction[y][x] = true;
    }

    function drawFinder(modules, isFunction, x, y) {
      const size = modules.length;
      for (let dy = -4; dy <= 4; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          const xx = x + dx;
          const yy = y + dy;
          if (0 <= xx && xx < size && 0 <= yy && yy < size) {
            const dist = Math.max(Math.abs(dx), Math.abs(dy));
            setFunction(modules, isFunction, xx, yy, dist !== 2 && dist !== 4);
          }
        }
      }
    }

    function drawAlignment(modules, isFunction, x, y) {
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          setFunction(modules, isFunction, x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
    }

    function getAlignmentPositions(version) {
      if (version === 1) return [];
      const size = version * 4 + 17;
      const numAlign = Math.floor(version / 7) + 2;
      const step = version === 32 ? 26 : Math.ceil((version * 4 + 4) / (numAlign * 2 - 2)) * 2;
      const result = [6];
      for (let pos = size - 7; result.length < numAlign; pos -= step) {
        result.splice(1, 0, pos);
      }
      return result;
    }

    function drawFormatBits(modules, isFunction, ecl, mask) {
      const size = modules.length;
      const eclBits = ecl === 1 ? 1 : 0;
      let data = (eclBits << 3) | mask;
      let rem = data;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >>> 9) & 1) * 0x537);
      const bits = ((data << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFunction(modules, isFunction, 8, i, getBit(bits, i));
      setFunction(modules, isFunction, 8, 7, getBit(bits, 6));
      setFunction(modules, isFunction, 8, 8, getBit(bits, 7));
      setFunction(modules, isFunction, 7, 8, getBit(bits, 8));
      for (let i = 9; i < 15; i++) setFunction(modules, isFunction, 14 - i, 8, getBit(bits, i));
      for (let i = 0; i < 8; i++) setFunction(modules, isFunction, size - 1 - i, 8, getBit(bits, i));
      for (let i = 8; i < 15; i++) setFunction(modules, isFunction, 8, size - 15 + i, getBit(bits, i));
      setFunction(modules, isFunction, 8, size - 8, true);
    }

    function drawVersion(modules, isFunction, version) {
      const size = modules.length;
      let rem = version;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ (((rem >>> 11) & 1) * 0x1F25);
      const bits = (version << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const dark = getBit(bits, i);
        setFunction(modules, isFunction, size - 11 + i % 3, Math.floor(i / 3), dark);
        setFunction(modules, isFunction, Math.floor(i / 3), size - 11 + i % 3, dark);
      }
    }

    function getBit(value, index) {
      return ((value >>> index) & 1) !== 0;
    }

    function drawCodewords(modules, isFunction, data) {
      const size = modules.length;
      let bitIndex = 0;
      for (let right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (let vert = 0; vert < size; vert++) {
          for (let j = 0; j < 2; j++) {
            const x = right - j;
            const upward = ((right + 1) & 2) === 0;
            const y = upward ? size - 1 - vert : vert;
            if (!isFunction[y][x] && bitIndex < data.length * 8) {
              modules[y][x] = getBit(data[Math.floor(bitIndex / 8)], 7 - bitIndex % 8);
              bitIndex++;
            }
          }
        }
      }
    }

    function applyMask(modules, isFunction, mask) {
      const size = modules.length;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (!isFunction[y][x] && maskCondition(mask, x, y)) modules[y][x] = !modules[y][x];
        }
      }
    }

    function maskCondition(mask, x, y) {
      if (mask === 0) return (x + y) % 2 === 0;
      if (mask === 1) return y % 2 === 0;
      if (mask === 2) return x % 3 === 0;
      if (mask === 3) return (x + y) % 3 === 0;
      if (mask === 4) return (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
      if (mask === 5) return (x * y) % 2 + (x * y) % 3 === 0;
      if (mask === 6) return ((x * y) % 2 + (x * y) % 3) % 2 === 0;
      return ((x + y) % 2 + (x * y) % 3) % 2 === 0;
    }

    window.addEventListener("afterprint", () => {
      document.getElementById("printArea").innerHTML = "";
    });

    applyPwaIcons();
    applyWebAppManifest();
    render();
    showIosInstallPromptIfNeeded();
  </script>
</body>
</html>
